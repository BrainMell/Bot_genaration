name: Deploy Bot Generation to Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/local/go/bin
            cd ~/bot_generation
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            go build -o bot-generation main.go
            npm install
            pm2 restart bot-generation-go bot-generation-scraper
